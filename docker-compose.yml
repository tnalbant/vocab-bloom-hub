# Vocab Bloom Hub: API + admin UI, with or without a bundled Postgres, and
# the project website on request (docs/deployment/docker.md).
#   cp .env.example .env   # set the passwords
#   docker compose up -d    # pulls the published images
# The bundled database is the `db` profile: COMPOSE_PROFILES=db in .env (the
# template's default) starts it and the server uses it; without the profile
# only the two apps start and DATABASE_URL in .env must name an external
# Postgres. The website (docs, API reference, playground, word pages) is
# the `site` profile: COMPOSE_PROFILES=db,site starts it too — off by
# default, an installation does not need it. Nothing in this file needs
# editing either way.
# The apps are published on localhost only, on ports away from the usual
# 3000 / 9090 of other tools: the API on 3240, the admin UI on 3241, the
# website on 3242 (SERVER_PORT / FRONT_PORT / SITE_PORT in .env; the
# observability overlay continues with 3243 and 3244). Put a reverse proxy with TLS in
# front for anything beyond this host (docs/deployment/reverse-proxy.md) —
# the admin login cookie is `secure` on https.

services:
  postgres:
    profiles: [db]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocab}
      # not published outside the compose network; .env.example still sets it
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocab}
      POSTGRES_DB: ${POSTGRES_DB:-vocab_bloom}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Postgres puts the dynamic shared memory of parallel queries into
    # /dev/shm, which Docker caps at 64 MB by default: a parallel hash join or
    # sort over the full dictionary then fails with "could not resize shared
    # memory segment … No space left on device" (SQLSTATE 53100)
    shm_size: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  server:
    # published by .github/workflows/docker.yml: `main` / `sha-…` from main,
    # `1.2.3` / `1.2` / `latest` from release tags (docs/deployment/docker.md);
    # VBH_TAG in .env pins a version. docker-compose.build.yml builds instead.
    image: ghcr.io/fristail27/vocab-bloom-hub-server:${VBH_TAG:-main}
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      # inside the container the server always listens on 3010; SERVER_PORT in
      # .env is the host port it is published on (3240 by default)
      SERVER_PORT: 3010
      # the bundled database (profile `db`) unless .env names another one;
      # a database on the Docker host is host.docker.internal, not localhost
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-vocab}:${POSTGRES_PASSWORD:-vocab}@postgres:5432/${POSTGRES_DB:-vocab_bloom}}
      # datasets the import page may load from the server (./imports on the host)
      DICTIONARY_IMPORT_DIR: /data/dictionary-imports
      # an empty instance loads the dictionary by itself on first start — from
      # ./imports when a dataset is there, otherwise from HuggingFace; the
      # readiness probe reports `importing` meanwhile (docs/deployment/docker.md)
      DICTIONARY_AUTO_IMPORT: ${DICTIONARY_AUTO_IMPORT:-true}
    volumes:
      - ./imports:/data/dictionary-imports:ro
    ports:
      - '127.0.0.1:${SERVER_PORT:-3240}:3010'
    # no depends_on: the database may live outside this file. The server
    # retries the connection for a minute at start and, past that, exits and
    # is restarted here — a bundled Postgres is ready long before.
    # SIGTERM → the server drains its requests for up to SHUTDOWN_TIMEOUT (30 s)
    stop_grace_period: 45s
    # Compose uses readiness to hold back the website until migrations and
    # the first-start import finish. A successful probe ends the grace period
    # immediately; a fresh instance may need time to download its dictionary.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:3010/api/ready" >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      start_period: 30m
      retries: 12
    restart: unless-stopped

  frontend:
    image: ghcr.io/fristail27/vocab-bloom-hub-frontend:${VBH_TAG:-main}
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      # server-side rendering and the /api/* forwarding talk to the API
      # directly, inside the compose network
      API_INTERNAL_URL: http://server:3010/api
    ports:
      - '127.0.0.1:${FRONT_PORT:-3241}:3000'
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

  site:
    # the project website next to this instance (profile `site`, issue #277):
    # the documentation and the API reference are static; the playground and
    # the word pages talk to the public API of `server`
    profiles: [site]
    image: ghcr.io/fristail27/vocab-bloom-hub-site:${VBH_TAG:-main}
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3020
      API_INTERNAL_URL: http://server:3010/api
    ports:
      - '127.0.0.1:${SITE_PORT:-3242}:3020'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
